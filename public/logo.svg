<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 顶面渐变 -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <!-- 左侧面渐变 -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1677ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003eb3;stop-opacity:1" />
    </linearGradient>
    <!-- 右侧面渐变 -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0050b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002766;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- 顶面 -->
    <path d="M50 10 L85 30 L50 50 L15 30 Z" fill="url(#topFace)" />
    <!-- 左侧面 -->
    <path d="M15 30 L50 50 L50 90 L15 70 Z" fill="url(#leftFace)" />
    <!-- 右侧面 -->
    <path d="M50 50 L85 30 L85 70 L50 90 Z" fill="url(#rightFace)" />
  </g>
</svg>